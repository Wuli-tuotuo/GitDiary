version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: gitdiary-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gitdiary123}
      MYSQL_DATABASE: gitdiary
      MYSQL_USER: gitdiary
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gitdiary123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gitdiary-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 数据库配置（使用 MySQL）
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/gitdiary?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: gitdiary
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-gitdiary123}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      # GitHub OAuth 配置（必填）
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-your_github_client_id}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-your_github_client_secret}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost/oauth/callback}

      # JWT 配置
      JWT_SECRET: ${JWT_SECRET:-gitdiary-production-secret-key-please-change-this-1234567890}

      # AI 大模型配置（硅基流动，必填）
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-Qwen/Qwen2.5-7B-Instruct}

      # 允许跨域
      SPRING_WEB_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gitdiary-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
