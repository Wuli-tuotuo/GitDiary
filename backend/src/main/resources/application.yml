server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: gitdiary-backend

  # 开发环境使用 H2 内存数据库
  datasource:
    url: jdbc:h2:mem:gitdiary;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # 生产环境使用 MySQL（取消注释并配置）
  # datasource:
  #   url: jdbc:mysql://localhost:3306/gitdiary?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  #   username: root
  #   password: your_password

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
        # 生产环境 MySQL 方言：
        # dialect: org.hibernate.dialect.MySQLDialect

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# GitHub OAuth 配置
github:
  oauth:
    client-id: ${GITHUB_CLIENT_ID:your_github_client_id}
    client-secret: ${GITHUB_CLIENT_SECRET:your_github_client_secret}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:5173/oauth/callback}
  api:
    base-url: https://api.github.com

# JWT 配置
jwt:
  secret: ${JWT_SECRET:gitdiary-secret-key-for-development-only-please-change-in-production-1234567890}
  expiration: 86400000  # 24小时，单位毫秒

# AI 大模型配置（硅基流动）
ai:
  provider: siliconflow
  api-key: ${AI_API_KEY:}
  base-url: https://api.siliconflow.cn/v1
  model: ${AI_MODEL:Qwen/Qwen2.5-7B-Instruct}
  timeout: 60000

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 日志配置
logging:
  level:
    com.gitdiary: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
